name: 'weather_analytics'
version: '1.0.0'

profile: 'weather_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  weather_analytics:
    staging:
      # Thin pass-through/cleanup of the raw table; kept as a lightweight view.
      +materialized: view
    intermediate:
      # Window-function scratch work; inlined as a CTE, no table/view created.
      +materialized: ephemeral
    analytics:
      # Final queryable table that dbt snapshot and the BI dashboard read from.
      +materialized: table
